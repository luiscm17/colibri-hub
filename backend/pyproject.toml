[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.138.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "supabase>=2.31.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["warehouse*", "infra*", "bootstrap*", "access*", "auth*"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]
