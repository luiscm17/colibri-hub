name: Feature request
description: Propose a new capability or a change to an existing one.
title: "feat(<context>): "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing. Business requirements are authoritative in the
        capability PRDs under `docs/prd/` — check whether this feature is
        already specified before proposing it.
  - type: dropdown
    id: context
    attributes:
      label: Bounded context
      description: Which capability does this feature belong to?
      options:
        - wh (Warehouse)
        - yarn (Yarn Spinning)
        - lots (Lot Processing)
        - access (Access Control)
        - cat (Shared Reference Data)
        - auth (Authentication)
        - ui (Frontend shell / cross-cutting)
        - infra (Tooling / cross-cutting)
    validations:
      required: true
  - type: dropdown
    id: prd-coverage
    attributes:
      label: PRD coverage
      description: Is this feature already specified in a capability PRD?
      options:
        - Yes, specified in a PRD — implementation proposal
        - Partially — PRD needs an update
        - No — new requirement
        - Not sure
    validations:
      required: true
  - type: textarea
    id: business-problem
    attributes:
      label: Business problem
      description: What problem does this solve and for whom?
    validations:
      required: true
  - type: textarea
    id: proposed-scope
    attributes:
      label: Proposed scope
      description: What should the feature do? Include boundaries and non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Observable outcomes that would prove the feature works.
    validations:
      required: false
